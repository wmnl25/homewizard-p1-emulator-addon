name: "HomeWizard P1 Emulator"
description: "Emulates a HomeWizard P1 meter using Home Assistant sensors. Provides API v1/v2, raw telegram passthrough, HTTPS/WebSocket, and an ingress Web UI for status and pairing."
version: "2.0.2"
slug: "homewizard_p1_emulator"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
host_network: true
homeassistant_api: true
hassio_api: true
ssl: true
map:
  - type: ssl
    read_only: true
ingress: true
ingress_port: 80
panel_icon: mdi:flash
panel_title: P1 Emulator
ports:
  80/tcp: 80
  443/tcp: 443
options:
  debug_mode: false
  api_mode: "v1" # Default HA discovery preference; both APIs remain available.
  raw_telegram: ""
  meter_type: '/ISK5\2M550E-1013'
  tls_certificate: ""
  tls_private_key: ""
  import_t1: "sensor.p1_energy_consumed_tariff_1"
  import_t2: "sensor.p1_energy_consumed_tariff_2"
  export_t1: "sensor.p1_energy_produced_tariff_1"
  export_t2: "sensor.p1_energy_produced_tariff_2"
  active_power_consumed: "sensor.p1_power_consumed"
  active_power_produced: "sensor.p1_power_produced"
schema:
  debug_mode: bool
  api_mode: list(v1|v2)
  raw_telegram: str?
  meter_type: str
  tls_certificate: str?
  tls_private_key: str?
  device_serial: str?
  import_t1: str?
  import_t2: str?
  import_t3: str?
  import_t4: str?
  export_t1: str?
  export_t2: str?
  export_t3: str?
  export_t4: str?
  active_power_consumed: str?
  active_power_produced: str?
  power_l1: str?
  power_l2: str?
  power_l3: str?
  voltage_l1: str?
  voltage_l2: str?
  voltage_l3: str?
  current_l1: str?
  current_l2: str?
  current_l3: str?
  frequency: str?
  short_power_drop: str?
  power_fail: str?
  voltage_sag_l1: str?
  voltage_sag_l2: str?
  voltage_sag_l3: str?
  voltage_swell_l1: str?
  voltage_swell_l2: str?
  voltage_swell_l3: str?
  active_power_average: str?
  monthly_power_peak: str?
  monthly_power_peak_timestamp: str?
  total_gas: str?
  gas_timestamp: str?
